        let currentLesson = 'all';
        let userAnswers = {};

        function renderQuiz() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const filteredData = currentLesson === 'all' 
                ? quizData 
                : quizData.filter(q => q.lesson === currentLesson);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 font-medium">Không có câu hỏi nào trong phần này.</div>`;
                return;
            }

            filteredData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl custom-shadow border border-slate-100 p-6 sm:p-8 transition';
                card.id = `q_card_${item.id}`;

                let content = `
                    <div class="flex items-center justify-between mb-4">
                        <span class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${item.title}</span>
                        <span class="text-xs font-semibold text-slate-400">Câu ${index + 1}</span>
                    </div>
                `;

                if (item.type === 'mc') {
                    const isAnswered = userAnswers[item.id] !== undefined;
                    const selectedOpt = userAnswers[item.id];
                    
                    content += `
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-4">${item.question}</h3>
                        <div class="space-y-2.5" id="options_${item.id}">
                    `;
                    item.options.forEach((opt, optIdx) => {
                        const isSelected = selectedOpt === optIdx;
                        let optionStyle = "bg-white border-slate-200 hover:bg-blue-50/50 hover:border-blue-300";
                        let radioChecked = isSelected ? 'checked' : '';
                        
                        if (isAnswered) {
                            if (optIdx === item.correct) {
                                optionStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold ring-1 ring-emerald-500";
                            } else if (isSelected && isSelected !== item.correct) {
                                optionStyle = "bg-rose-50 border-rose-400 text-rose-900 font-semibold ring-1 ring-rose-400";
                            }
                        }

                        content += `
                            <label class="flex items-start p-3.5 rounded-xl border ${optionStyle} cursor-pointer transition">
                                <input type="radio" name="${item.id}" value="${optIdx}" ${radioChecked} onchange="handleAnswer('${item.id}', ${optIdx})" class="mt-1 text-blue-600 focus:ring-blue-500 h-4 w-4">
                                <span class="ml-3 text-sm sm:text-base font-medium">${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                            </label>
                        `;
                    });
                    content += `</div>`;

                    // Instant Explanation
                    if (isAnswered) {
                        const isCorrect = selectedOpt === item.correct;
                        content += `
                            <div class="mt-4 p-4 rounded-xl text-sm font-medium ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800'}">
                                ${isCorrect ? '✅ <strong>Chính xác!</strong>' : `❌ <strong>Chưa chính xác!</strong> Đáp án đúng là <strong>${String.fromCharCode(65 + item.correct)}</strong>.`} ${item.explanation}
                            </div>
                        `;
                    }

                } else if (item.type === 'tf') {
                    content += `
                        <div class="bg-slate-50 p-4 rounded-xl text-slate-700 text-sm italic mb-4 border border-slate-200">
                            <strong>Thông tin:</strong> ${item.passage}
                        </div>
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-4">Xác định các nhận định sau là Đúng hay Sai:</h3>
                        <div class="space-y-4">
                    `;
                    item.statements.forEach((st, stIdx) => {
                        const userVal = userAnswers[`${item.id}_${stIdx}`];
                        const isStAnswered = userVal !== undefined;
                        const isStCorrect = userVal === st.answer;

                        content += `
                            <div class="p-4 rounded-xl border border-slate-200 ${isStAnswered ? (isStCorrect ? 'bg-emerald-50/40 border-emerald-300' : 'bg-rose-50/40 border-rose-300') : 'bg-slate-50/50'}">
                                <p class="text-sm sm:text-base font-medium text-slate-800 mb-3">${st.text}</p>
                                <div class="flex space-x-4">
                                    <label class="inline-flex items-center cursor-pointer px-4 py-2 rounded-lg border ${userVal === true ? 'bg-emerald-600 text-white font-bold border-emerald-600' : 'bg-white border-slate-300 text-slate-700'} transition">
                                        <input type="radio" name="${item.id}_${stIdx}" value="true" ${userVal === true ? 'checked' : ''} onchange="handleTFAnswer('${item.id}', ${stIdx}, true)" class="hidden">
                                        <span class="text-sm">Đúng</span>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer px-4 py-2 rounded-lg border ${userVal === false ? 'bg-rose-600 text-white font-bold border-rose-600' : 'bg-white border-slate-300 text-slate-700'} transition">
                                        <input type="radio" name="${item.id}_${stIdx}" value="false" ${userVal === false ? 'checked' : ''} onchange="handleTFAnswer('${item.id}', ${stIdx}, false)" class="hidden">
                                        <span class="text-sm">Sai</span>
                                    </label>
                                </div>
                                ${isStAnswered ? `
                                    <div class="mt-2.5 text-xs font-bold ${isStCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                        ${isStCorrect ? '✅ Đúng rồi!' : `❌ Sai rồi! Đáp án đúng là: <strong>${st.answer ? 'Đúng' : 'Sai'}</strong>.`} ${st.exp}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                    content += `</div>`;
                } else if (item.type === 'sa') {
                    const userVal = userAnswers[item.id] || '';
                    const isAnswered = userVal !== '';
                    const cleanUser = String(userVal).trim().replace(',', '.');
                    const cleanCorrect = String(item.correctAnswer).trim().replace(',', '.');
                    const isCorrect = isAnswered && (cleanUser === cleanCorrect || (Math.abs(parseFloat(cleanUser) - parseFloat(cleanCorrect)) < 0.1 && !isNaN(cleanUser)));

                    content += `
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-3">${item.question}</h3>
                        <div class="flex items-center space-x-3 mb-2">
                            <input type="text" id="sa_${item.id}" value="${userVal}" placeholder="Nhập kết quả..." onblur="handleSAAnswer('${item.id}', this.value)" onkeydown="if(event.key === 'Enter') handleSAAnswer('${item.id}', this.value)" class="flex-1 max-w-xs px-4 py-2.5 rounded-xl border ${isAnswered ? (isCorrect ? 'border-emerald-500 bg-emerald-50/30' : 'border-rose-500 bg-rose-50/30') : 'border-slate-300'} focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 font-semibold">
                            <span class="text-sm font-bold text-slate-600">${item.unit || ''}</span>
                            <button onclick="handleSAAnswer('${item.id}', document.getElementById('sa_${item.id}').value)" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition">Xác nhận</button>
                        </div>
                    `;

                    if (isAnswered) {
                        content += `
                            <div class="mt-3 p-4 rounded-xl text-sm font-medium ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800'}">
                                ${isCorrect ? '✅ <strong>Chính xác!</strong>' : `❌ <strong>Chưa chính xác!</strong> Đáp án chuẩn là <strong>${item.correctAnswer} ${item.unit || ''}</strong>.`} ${item.explanation}
                            </div>
                        `;
                    }
                }

                card.innerHTML = content;
                container.appendChild(card);
            });

            updateProgress();
        }

        function filterLesson(lesson) {
            currentLesson = lesson;
            document.querySelectorAll('.lesson-tab').forEach(btn => {
                if (btn.getAttribute('data-lesson') === lesson) {
                    btn.className = 'lesson-tab px-4 py-2 rounded-xl font-semibold text-sm transition bg-blue-600 text-white shadow-md';
                } else {
                    btn.className = 'lesson-tab px-4 py-2 rounded-xl font-semibold text-sm transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200';
                }
            });
            renderQuiz();
        }

        // Handle Instant Interactions
        function handleAnswer(questionId, optionIndex) {
            userAnswers[questionId] = optionIndex;
            renderQuiz();
        }

        function handleTFAnswer(questionId, statementIndex, value) {
            userAnswers[`${questionId}_${statementIndex}`] = value;
            renderQuiz();
        }

        function handleSAAnswer(questionId, value) {
            if (value.trim() !== '') {
                userAnswers[questionId] = value.trim();
                renderQuiz();
            }
        }

        function calculateScore() {
            let score = 0;
            let totalPossible = 0;
            let answeredCount = 0;

            quizData.forEach(q => {
                if (q.type === 'mc') {
                    totalPossible += 1;
                    if (userAnswers[q.id] !== undefined) {
                        answeredCount++;
                        if (userAnswers[q.id] === q.correct) score += 1;
                    }
                } else if (q.type === 'tf') {
                    q.statements.forEach((st, idx) => {
                        totalPossible += 1;
                        if (userAnswers[`${q.id}_${idx}`] !== undefined) {
                            answeredCount++;
                            if (userAnswers[`${q.id}_${idx}`] === st.answer) score += 1;
                        }
                    });
                } else if (q.type === 'sa') {
                    totalPossible += 1;
                    if (userAnswers[q.id] !== undefined && userAnswers[q.id] !== '') {
                        answeredCount++;
                        const cleanUser = String(userAnswers[q.id]).trim().replace(',', '.');
                        const cleanCorrect = String(q.correctAnswer).trim().replace(',', '.');
                        if (cleanUser === cleanCorrect || (Math.abs(parseFloat(cleanUser) - parseFloat(cleanCorrect)) < 0.1 && !isNaN(cleanUser))) {
                            score += 1;
                        }
                    }
                }
            });

            return { score, totalPossible, answeredCount };
        }

        function updateProgress() {
            const { score, totalPossible, answeredCount } = calculateScore();

            const percent = totalPossible > 0 ? Math.round((answeredCount / totalPossible) * 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${answeredCount} / ${totalPossible} ý (${percent}%)`;
            document.getElementById('headerTotal').innerText = totalPossible;
            document.getElementById('headerScore').innerText = score;
            document.getElementById('correctCount').innerText = score;
        }

        function submitAll() {
            const { score, totalPossible } = calculateScore();
            const percent = totalPossible > 0 ? (score / totalPossible) * 100 : 0;
            const roundedPercent = Math.round(percent);

            document.getElementById('modalScoreDisplay').innerText = `${score} / ${totalPossible}`;
            document.getElementById('modalPercentage').innerText = `Tỉ lệ chính xác: ${roundedPercent}%`;

            const subtextEl = document.getElementById('modalSubtext');
            const iconEl = document.getElementById('modalIcon');

            // Custom Grading Feedback Rules
            if (percent < 50) {
                iconEl.innerText = '🐥';
                subtextEl.innerText = 'gà vãi =))';
                subtextEl.className = 'text-xl font-extrabold text-rose-600 mt-3 pt-3 border-t border-slate-200';
            } else if (percent < 70) {
                iconEl.innerText = '👍';
                subtextEl.innerText = 'cũng tạm';
                subtextEl.className = 'text-xl font-extrabold text-amber-600 mt-3 pt-3 border-t border-slate-200';
            } else if (percent < 95) {
                iconEl.innerText = '🔥';
                subtextEl.innerText = 'ổn đấy';
                subtextEl.className = 'text-xl font-extrabold text-blue-600 mt-3 pt-3 border-t border-slate-200';
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            } else {
                iconEl.innerText = '🐢';
                subtextEl.innerText = 'rùa à 🐢';
                subtextEl.className = 'text-xl font-extrabold text-emerald-600 mt-3 pt-3 border-t border-slate-200';
                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
            }

            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        function resetQuiz() {
            userAnswers = {};
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            renderQuiz();
        };
    </script>
</body>
</html>
